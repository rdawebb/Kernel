[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Kernel"
version = "0.1.0"
description = "A minimal email client"
authors = [{ name = "Rob Webb", email = "rdawebb@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "aiofiles>=25.1.0,<26.0.0",
    "aiosqlite>=0.22.1,<1.0.0",
    "alembic>=1.18.1,<2.0.0",
    "apscheduler>=3.11.2,<4.0.0",
    "cryptography>=48.0.0,<49.0.0",
    "email_validator>=2.3.0,<3.0.0",
    "greenlet>=3.5.0,<4.0.0",
    "keyring>=25.7.0,<26.0.0",
    "prompt-toolkit>=3.0.52,<4.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "rich>=15.0.0,<16.0.0",
    "sqlalchemy[asyncio]>=2.0.45,<3.0.0",
    "textual>=8.0.0,<9.0.0"
]

[project.optional-dependencies]
dev = [
    "prek>=0.4.1,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3,<2.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.15.14,<1.0.0",
    "rust-just>=1.51.0,<2.0.0",
    "ty>=0.0.38,<0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
kernel = "cli.cli:main"
